<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ardiyan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- صفحه ورود -->
  <main id="welcomePage" class="page welcome-page">
    <section class="welcome-content">
      <div class="sword-symbol">⚔</div>
      <h1>
        به دنیای آردیان<br>
        خوش اومدی ماجراجو!
      </h1>
      <input id="playerName" type="text" maxlength="16" placeholder="... آردیان" autocomplete="off">
      <button id="enterButton" class="main-button">تأیید و ورود</button>
      <p class="bottom-text">نام خودتو انتخاب کن تا ماجراجویی رو آغاز کنیم ...</p>
    </section>
  </main>

  <!-- صفحه انتخاب نژاد -->
  <main id="racePage" class="page race-page hidden">
    <img src="assets/race-bg0.jpg" usemap="#image-map" class="race-image" alt="انتخاب نژاد">

    <map name="image-map">
      <area target="" alt="انسان" title="انسان" href="#" coords="761,245,651,355" shape="rect" data-race="human">
      <area target="" alt="دروف" title="دروف" href="#" coords="884,244,771,355" shape="rect" data-race="dwarf">
      <area target="" alt="نیمه انسان" title="نیمه انسان" href="#" coords="760,363,650,471" shape="rect" data-race="halfHuman">
      <area target="" alt="نیمه دراگون" title="نیمه دراگون" href="#" coords="883,365,767,470" shape="rect" data-race="dragon">
      <area target="" alt="الف" title="الف" href="#" coords="762,482,649,584" shape="rect" data-race="elf">
      <area target="" alt="فرشته" title="فرشته" href="#" coords="885,482,769,586" shape="rect" data-race="angel">
      <area target="" alt="تأیید" title="تأیید" href="#" coords="682,1482,273,1585" shape="rect" id="confirmArea">
    </map>
  </main>

  <script src="script.js"></script>
</body>
</html>
