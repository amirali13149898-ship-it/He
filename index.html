<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ardiyan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- صفحه ورود بازیکن -->
  <main id="welcomePage" class="page welcome-page">
    <section class="welcome-content">
      <div class="sword-symbol">⚔</div>

      <h1>
        به دنیای آردیان<br>
        خوش اومدی ماجراجو!
      </h1>

      <input
        id="playerName"
        type="text"
        maxlength="16"
        placeholder="... آردیان"
        autocomplete="off"
      >

      <button id="enterButton" class="main-button">
        تأیید و ورود
      </button>

      <p class="bottom-text">
        نام خودتو انتخاب کن تا ماجراجویی رو آغاز کنیم ...
      </p>
    </section>
  </main>

  <!-- صفحه انتخاب نژاد -->
  <main id="racePage" class="page race-page hidden">

    <header class="game-title">ARDIYAN</header>

    <!-- کادر نژادها در گوشه بالا سمت راست -->
    <div class="race-panel">
      <div id="raceButtons" class="race-grid">
        <button class="race-button" data-race="human">انسان</button>
        <button class="race-button" data-race="dwarf">دروف</button>
        <button class="race-button" data-race="halfHuman">نیمه<br>انسان</button>
        <button class="race-button" data-race="dragon">نیمه<br>دراگون</button>
        <button class="race-button" data-race="elf">الف</button>
        <button class="race-button" data-race="angel">فرشته</button>
      </div>
    </div>

    <!-- دکمه تأیید پایین صفحه -->
    <button id="confirmRaceButton" class="confirm-button" disabled>
      تأیید
    </button>

  </main>

  <script src="script.js"></script>
</body>
</html>
