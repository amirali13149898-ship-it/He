<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بازی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Tahoma, Arial, sans-serif;
    }

    /* ظرف اصلی که عکس قلعه داخلشه */
    .game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-image: url('castle-background.jpg'); /* ← اسم عکس قلعه رو اینجا بگذار */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* پنل ۶ تایی نژادها (سمت راست) */
    .race-panel {
      position: absolute;
      top: 12%;
      right: 3%;
      width: 32%;                 /* کمی باریک‌تر */
      max-width: 230px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;                   /* فاصله کمتر */
      padding: 8px;              /* پدینگ کمتر */
      background: rgba(0, 0, 0, 0.75);
      border: 2.5px solid #d4af37;
      border-radius: 14px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
      z-index: 20;
    }

    /* هر دکمه نژاد - کوچیک‌تر شده */
    .race-btn {
      background: linear-gradient(145deg, #f5f0e1, #e8dcc8);
      border: 1.8px solid #c9a227;
      border-radius: 8px;
      padding: 8px 4px;          /* پدینگ کمتر */
      font-size: 13px;           /* فونت کوچیک‌تر */
      font-weight: bold;
      color: #2c1e0f;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.1);
      min-height: 42px;          /* ارتفاع کمتر */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* وقتی لمس می‌شه */
    .race-btn:active {
      transform: scale(0.95);
    }

    /* وقتی انتخاب شده */
    .race-btn.selected {
      background: linear-gradient(145deg, #ffe08a, #f0c040);
      border-color: #ff9900;
      box-shadow: 0 0 12px #ffaa00, inset 0 0 8px rgba(255,150,0,0.3);
      color: #1a0f00;
    }

    /* دکمه تأیید پایین */
    .confirm-btn {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      max-width: 240px;
      padding: 11px 18px;        /* کمی کوچیک‌تر */
      background: linear-gradient(90deg, #8b4513, #d2691e, #8b4513);
      border: 2.5px solid #ffd700;
      border-radius: 40px;
      color: #fff8dc;
      font-size: 17px;
      font-weight: bold;
      text-shadow: 0 0 8px #000;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 180, 0, 0.7);
      z-index: 30;
      transition: all 0.2s;
    }

    .confirm-btn:active {
      transform: translateX(-50%) scale(0.97);
    }

    .confirm-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="game-container">

    <!-- پنل انتخاب نژاد -->
    <div class="race-panel">
      <button class="race-btn" data-race="انسان">انسان</button>
      <button class="race-btn" data-race="دروف">دروف</button>
      <button class="race-btn" data-race="نیمه انسان">نیمه انسان</button>
      <button class="race-btn" data-race="نیمه دارگون">نیمه دارگون</button>
      <button class="race-btn" data-race="الف">الف</button>
      <button class="race-btn" data-race="فرشته">فرشته</button>
    </div>

    <!-- دکمه تأیید -->
    <button class="confirm-btn" id="confirmBtn" disabled>تأیید</button>
  </div>

  <script>
    let selectedRace = null;
    const buttons = document.querySelectorAll('.race-btn');
    const confirmBtn = document.getElementById('confirmBtn');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedRace = btn.getAttribute('data-race');
        confirmBtn.disabled = false;
      });
    });

    confirmBtn.addEventListener('click', () => {
      if (selectedRace) {
        alert('نژاد انتخاب شده: ' + selectedRace);
      }
    });

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
