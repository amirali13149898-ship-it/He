<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ardiyan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- صفحه ورود -->
  <main id="welcomePage" class="page welcome-page">
    <section class="welcome-content">
      <div class="sword-symbol">⚔</div>
      <h1>
        به دنیای آردیان<br>
        خوش اومدی ماجراجو!
      </h1>
      <input id="playerName" type="text" maxlength="16" placeholder="... آردیان" autocomplete="off">
      <button id="enterButton" class="main-button">تأیید و ورود</button>
      <p class="bottom-text">نام خودتو انتخاب کن تا ماجراجویی رو آغاز کنیم ...</p>
    </section>
  </main>

  <!-- صفحه انتخاب نژاد (با عکس اصلی) -->
  <main id="racePage" class="page race-page hidden">
    
    <!-- دکمه‌های نژاد (شفاف روی عکس) -->
    <div class="race-buttons-container">
      <button class="race-btn" data-race="human" style="top: 18%; right: 8%;"></button>
      <button class="race-btn" data-race="dwarf" style="top: 18%; right: 22%;"></button>
      <button class="race-btn" data-race="halfHuman" style="top: 28%; right: 8%;"></button>
      <button class="race-btn" data-race="dragon" style="top: 28%; right: 22%;"></button>
      <button class="race-btn" data-race="elf" style="top: 38%; right: 8%;"></button>
      <button class="race-btn" data-race="angel" style="top: 38%; right: 22%;"></button>
    </div>

    <!-- دکمه تأیید -->
    <button id="confirmRaceButton" class="confirm-btn" disabled>تأیید</button>

  </main>

  <script src="script.js"></script>
</body>
</html>
