<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ardiyan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- صفحه ورود بازیکن -->
  <main id="welcomePage" class="page welcome-page">
    <section class="welcome-content">
      <div class="sword-symbol">⚔</div>

      <h1>
        به دنیای آردیان<br>
        خوش اومدی ماجراجو!
      </h1>

      <input
        id="playerName"
        type="text"
        maxlength="16"
        placeholder="... آردیان"
        autocomplete="off"
      >

      <button id="enterButton" class="main-button">
        تأیید و ورود
      </button>

      <p class="bottom-text">
        نام خودتو انتخاب کن تا ماجراجویی رو آغاز کنیم ...
      </p>
    </section>
  </main>

  <!-- صفحه انتخاب نژاد -->
  <main id="racePage" class="page race-page hidden">

    <header class="game-title">ARDIYAN</header>

    <section class="race-content">

      <h2>نژاد خود را انتخاب کنید</h2>

      <!-- ابتدا خالی است و بعد از انتخاب نژاد پر می‌شود -->
      <div id="characterPreview" class="character-preview">
        <p>برای دیدن شخصیت، یک نژاد را انتخاب کنید</p>
      </div>

      <div id="raceButtons" class="race-buttons">

        <button class="race-button" data-race="human">
          انسان
        </button>

        <button class="race-button" data-race="dwarf">
          دروف
        </button>

        <button class="race-button" data-race="dragon">
          نیمه<br>دراگون
        </button>

        <button class="race-button" data-race="halfHuman">
          نیمه<br>انسان
        </button>

        <button class="race-button" data-race="angel">
          فرشته
        </button>

        <button class="race-button" data-race="elf">
          الف
        </button>

      </div>

      <button id="confirmRaceButton" class="confirm-button" disabled>
        تأیید
      </button>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
